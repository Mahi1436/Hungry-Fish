<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#06284f">
    <meta name="description"
        content="Hungry Fish: eat smaller fish, avoid bigger ones and grow. A canvas game built with HTML, CSS and JavaScript.">
    <title>Hungry Fish</title>
    <style>
        /* ===== Design tokens (colors, shadow) ===== */
        :root {
            --bg: #04162e;
            --panel: #0c2a4d;
            --panel2: #12386a;
            --text: #eaf6ff;
            --muted: #9cc3e6;
            --line: #ffffff1f;
            --accent: #ffb703;
            --accent2: #4cc9f0;
            --good: #4ade80;
            --danger: #ef476f;
            --shadow: 0 20px 60px #0007
        }

        /* ===== Global reset and page background ===== */
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 15% 10%, #1fa2d633, transparent 35%), radial-gradient(circle at 90% 90%, #4cc9f022, transparent 30%), var(--bg);
            color: var(--text);
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif
        }
    </style>
</head>

<body>
</body>

</html>
